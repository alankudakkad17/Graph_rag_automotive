version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
#  Graph RAG Automotive Stack
#  Includes: Neo4j (free community edition)
#  LLM is served by Ollama on the HOST machine (not containerised)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Neo4j Community (free) ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: automotive_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/automotive_rag
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "automotive_rag", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
